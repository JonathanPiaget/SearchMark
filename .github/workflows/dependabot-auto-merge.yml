name: Dependabot auto-merge

# Opened only: auto-merge survives later pushes, and a synchronize from the CI
# autofix push must not turn it back on after that workflow disabled it
on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for gh pr merge to enable auto-merge
      pull-requests: write # for gh pr merge to enable auto-merge
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
      # Allowlist: an empty or unknown update type stays manual
      - if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
