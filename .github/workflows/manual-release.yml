name: Manual Release
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Zip extensions
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Read changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2.4.0
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGES: ${{ steps.changelog.outputs.changes }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "${CHANGES}" \
            .output/*-chrome.zip \
            .output/*-firefox.zip \
            .output/*-sources.zip
